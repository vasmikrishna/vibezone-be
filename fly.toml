app = "vibezone-api"
primary_region = "sin"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  TRUST_PROXY = "1"
  ALLOWED_ORIGINS = "https://vibezone.varchas.store,capacitor://localhost,https://localhost"

[http_service]
  internal_port = 3001
  force_https = true
  # ponytail: one always-on machine; live rooms and matching are in memory, so no scaling out.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
